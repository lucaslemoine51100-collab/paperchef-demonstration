<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperChef · Connexion</title><link rel="stylesheet" href="/app.css"><style>.login{max-width:850px;margin:8vh auto;background:white;border:1px solid #dbe5df;border-radius:16px;padding:36px}.login h1{margin:20px 0}.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.profiles .profile-icon{display:block;margin:0 auto 8px;width:30px;height:30px}.profiles button{min-height:85px;background:#eef5ef;border:1px solid #bccfc2;border-radius:10px;color:#20372e;font-weight:700;font-size:17px}.profiles button[aria-pressed=true]{background:#20372e;color:white}.login form{max-width:440px;margin:auto;display:grid;gap:18px}.login .brand{justify-content:center}.login small{color:#61766a}.login #error{color:#a62232}@media(max-width:650px){.login{margin:20px;padding:20px}.profiles{grid-template-columns:1fr}}</style><body><main class="login"><div class="brand"><img src="/icon.svg" width="48" height="48" alt=""><span>PaperChef<span class="brand-sub">Version vierge · données séparées</span></span></div><h1 id="title">Bienvenue dans PaperChef</h1><p id="intro">Choisissez votre espace puis connectez-vous à votre compte.</p><div class="profiles"><button data-role="cook" aria-pressed="true">Cuisine</button><button data-role="store" aria-pressed="false">Magasin</button><button data-role="diet" aria-pressed="false">Diététique</button></div><form><label id="names">Votre nom<select name="username" required></select></label><label id="setup-name" hidden>Nom affiché<input name="name" maxlength="100" autocomplete="name"></label><label id="setup-user" hidden>Identifiant<input name="newUsername" minlength="3" maxlength="60" autocomplete="username"></label><label>Mot de passe<input name="password" type="password" required autocomplete="current-password" maxlength="128"></label><p id="error" role="alert"></p><button class="button" type="submit">Se connecter</button><small>Votre compte détermine vos droits. Le planning est partagé entre les utilisateurs.</small></form></main><script src="/profile-icons.js"></script><script>
document.querySelectorAll("[data-role]").forEach(b=>b.insertAdjacentHTML("afterbegin",PaperChefProfiles.icon(b.dataset.role)));
let role='cook',users=[],setup=false,developmentLogin=false;const form=document.querySelector('form'),select=form.elements.username;
async function request(url,data){const r=await fetch(url,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const x=await r.json();if(!r.ok)throw Error(x.error);return x;}
function names(){select.replaceChildren();for(const u of users.filter(x=>x.role===role))select.add(new Option(PaperChefProfiles.name(u.name),u.username));document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===role)));}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;names();});
request('/api/shared/login-info').then(x=>{users=x.users;setup=x.setup;developmentLogin=x.developmentLogin;if(developmentLogin&&!setup){form.elements.password.required=false;form.elements.password.closest('label').hidden=true;document.querySelector('#intro').textContent='Mode création local : choisissez votre espace et votre nom, sans mot de passe.';form.querySelector('[type=submit]').textContent='Ouvrir cet espace';}if(setup){select.disabled=true;select.required=false;document.querySelector('#title').textContent='Créer le premier cuisinier administrateur';document.querySelector('#intro').textContent='Initialisation locale de la version partagée de test.';document.querySelector('.profiles').hidden=true;document.querySelector('#names').hidden=true;document.querySelector('#setup-name').hidden=false;document.querySelector('#setup-user').hidden=false;form.elements.name.required=true;form.elements.newUsername.required=true;form.elements.password.minLength=12;form.elements.password.autocomplete='new-password';form.querySelector('small').textContent='Mot de passe : 12 caractères minimum. Identifiant : au moins 3 caractères, lettres sans accent, chiffres, point, tiret ou soulignement.';form.querySelector('[type=submit]').textContent='Créer mon compte';}names();}).catch(e=>document.querySelector('#error').textContent=e.message);
form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('[type=submit]');b.disabled=true;try{if(setup){await request('/api/shared/setup',{username:form.elements.newUsername.value,name:form.elements.name.value,password:form.elements.password.value});location.reload();}else{await request('/api/shared/login',{username:select.value,password:form.elements.password.value,role});location.href='/#semaine';}}catch(e){document.querySelector('#error').textContent=e.message;}finally{b.disabled=false;}};
</script></body></html>
